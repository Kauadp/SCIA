services:

  # === SCIA WEBHOOK ===
  webhook:
    container_name: scia_webhook

    build:
      context: ../..
      dockerfile: Dockerfile

    restart: always

    command: uvicorn app.webhook.main:app --host 0.0.0.0 --port 8000

    networks:
      - evolution-net


  # === EVOLUTION API ===
  api:
    container_name: scia_evolution
    image: evoapicloud/evolution-api:latest
    restart: always

    depends_on:
      - redis
      - evolution-postgres

    ports:
      - "8080:8080"

    volumes:
      - evolution_instances:/evolution/instances

    networks:
      - evolution-net

    env_file:
      - .env


  # === REDIS ===
  redis:
    container_name: scia_evolution_redis
    image: redis:latest
    restart: always

    command: redis-server --appendonly yes

    volumes:
      - evolution_redis:/data

    networks:
      - evolution-net


  # === POSTGRES ===
  evolution-postgres:
    container_name: scia_evolution_postgres
    image: postgres:15
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - evolution-net


volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:


networks:
  evolution-net:
    name: scia_evolution-net
    driver: bridge